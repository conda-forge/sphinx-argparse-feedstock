{% set python_min = "3.10" %}
{% set name = "sphinx-argparse" %}
{% set version = "0.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/sphinx_argparse-{{ version }}.tar.gz
  sha256: d072bb67dd52b294375f0eedc203cb8e50d0329910dbceb6764e9386bff94e9d

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - flit-core >=3.7
    - pip
  run:
    - python >={{ python_min }}
    - sphinx >=5.1.0
    - docutils >=0.19
    - commonmark >=0.5.6

test:
  imports:
    - sphinxarg
    - sphinxarg.ext
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/sphinx-doc/sphinx-argparse/
  license: MIT
  license_file: LICENCE.rst
  summary: Sphinx extension that automatically documents argparse commands and options
  doc_url: https://sphinx-argparse.readthedocs.io/
  dev_url: https://github.com/sphinx-doc/sphinx-argparse/

extra:
  recipe-maintainers:
    - conda-forge/sphinx
    - croth1
    - dpryan79
